<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>虫控服务商管理平台</title>
<style>
  :root{
    --green:#2e7d32; --green-d:#1b5e20; --line:#e0e4e0;
    --tab-on:#ffd54f; --tab-off:#cfe8cf;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:flex;flex-direction:column;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#f5f7f5;
  }
  .topbar{
    flex:0 0 auto;display:flex;align-items:stretch;
    background:var(--green-d);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);z-index:10;
  }
  .brand{
    flex:0 0 auto;display:flex;align-items:center;gap:6px;
    padding:0 12px;font-weight:700;font-size:15px;white-space:nowrap;
    border-right:1px solid rgba(255,255,255,.15);
  }
  .tabs{flex:1 1 auto;display:flex;overflow-x:auto}
  .tabs::-webkit-scrollbar{height:0}
  .tab{
    flex:0 0 auto;display:flex;align-items:center;padding:16px 18px;
    color:var(--tab-off);font-size:15px;cursor:pointer;white-space:nowrap;
    border-bottom:3px solid transparent;user-select:none;
  }
  .tab.active{
    color:#fff;font-weight:700;background:rgba(255,255,255,.10);
    border-bottom-color:var(--tab-on);
  }
  .frame{
    flex:1 1 auto;min-height:0;width:100%;border:0;display:block;background:#fff;
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">🐞 虫控平台</div>
    <div class="tabs" id="tabs">
      <div class="tab active" data-src="/daily">日常消杀</div>
      <div class="tab" data-src="/report">现场报告</div>
      <div class="tab" data-src="/staff">现场人员</div>
      <div class="tab" data-src="/insecticides">杀虫剂清单</div>
      <div class="tab" data-src="/admin">管理后台</div>
    </div>
  </div>
  <iframe id="frame" class="frame" src="/daily"></iframe>

  <script>
    // 版本占位（部署时由服务器替换为构建号，仅用于排查缓存）
    const PAGE_BUILD = "__BUILD__";
    const FR = document.getElementById("frame");
    const tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));

    function switchTo(el){
      tabs.forEach(function(t){ t.classList.remove("active"); });
      el.classList.add("active");
      FR.src = el.getAttribute("data-src");
    }

    tabs.forEach(function(t){
      t.addEventListener("click", function(){ switchTo(t); });
    });

    // 模块加载后做少量外壳级清理，避免双重入口
    FR.addEventListener("load", function(){
      try{
        var d = FR.contentDocument;
        if(!d) return;
        // 日常消杀模块内那行“填写现场服务报告”链接在外壳已有标签，隐藏之
        var a = d.querySelector('a[href="/report"]');
        if(a){ var box = a.closest("div"); if(box && box.parentNode) box.parentNode.removeChild(box); }
      }catch(e){ /* 跨域或异常忽略 */ }
    });
  </script>
</body>
</html>
