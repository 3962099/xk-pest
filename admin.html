<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>虫控消杀 · 管理后台</title>
<script src="/xlsx.full.min.js"></script>
<script src="/stations.js"></script>
<style>
  :root{
    --green:#2e7d32; --green-d:#1b5e20; --bg:#f5f7f5; --card:#fff;
    --line:#e0e4e0; --txt:#222; --muted:#6b7280; --red:#c62828; --amber:#ef6c00;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--txt);line-height:1.5;font-size:15px}
  header{background:var(--green-d);color:#fff;padding:14px 16px;display:flex;flex-wrap:wrap;
    align-items:center;gap:10px;justify-content:space-between}
  header h1{margin:0;font-size:17px}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  button{cursor:pointer;font-size:14px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);
    background:#fff;color:var(--txt)}
  button.pri{background:var(--green);color:#fff;border-color:var(--green)}
  button.ghost{background:#fff}
  button.danger{color:var(--red);border-color:#f0c0c0}
  main{max-width:1100px;margin:0 auto;padding:14px}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .toolbar input,.toolbar select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px}
  .toolbar input[type=search]{flex:1;min-width:160px}
  .stat{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;color:var(--muted);font-size:13px}
  .stat b{color:var(--txt)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;overflow:auto}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top;white-space:nowrap}
  th{background:#eef3ee;position:sticky;top:0}
  .ok{color:var(--green);font-weight:600}
  .wait{color:var(--amber);font-weight:600}
  .empty{text-align:center;color:var(--muted);padding:30px}
  /* 密码门 */
  #lock{position:fixed;inset:0;background:rgba(20,40,20,.55);display:flex;align-items:center;justify-content:center;z-index:50}
  #lock .box{background:#fff;border-radius:14px;padding:24px 22px;width:300px;max-width:86vw;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  #lock h2{margin:0 0 6px;font-size:17px;color:var(--green-d)}
  #lock p{margin:0 0 14px;color:var(--muted);font-size:13px}
  #lock input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:16px;letter-spacing:4px;text-align:center}
  #lock button{width:100%;margin-top:14px;background:var(--green);color:#fff;border:none;font-size:15px;padding:11px}
  .err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
  .link{color:var(--green);font-size:13px;cursor:pointer;text-decoration:underline}
  .link:hover{color:var(--green-d)}
  tr.rec{cursor:pointer}
  tr.rec:hover{background:#f0f7f0}
  .tip{color:var(--muted);font-size:12px;margin:0 0 8px}
  .viewtabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .viewtab{padding:9px 16px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);font-size:14px}
  .viewtab.active{background:var(--green);color:#fff;border-color:var(--green);font-weight:600}
  .rep-sec{border:1px solid var(--line);border-radius:9px;padding:10px;margin:8px 0;overflow:auto}
  .rep-sec h4{margin:0 0 6px;font-size:14px;color:var(--green-d)}
  .rep-sec .mini-note{color:var(--muted);font-size:12px;margin-bottom:6px}
  #reportDetail .box{max-width:920px}
  #detail,#reportDetail{position:fixed;inset:0;background:rgba(20,40,20,.5);display:none;align-items:flex-start;justify-content:center;z-index:60;overflow:auto;padding:20px}
  #detail .box,#reportDetail .box{background:#fff;border-radius:14px;max-width:780px;width:100%;padding:18px;margin:auto}
  #detail .close,#reportDetail .close{float:right;background:#fff}
  #detail h2,#reportDetail h2{margin:0 0 2px;font-size:18px;color:var(--green-d)}
  #detail .sub,#reportDetail .sub{color:var(--muted);font-size:12px;margin-bottom:12px}
  #detail h3,#reportDetail h3{margin:12px 0 4px;font-size:15px;color:var(--green-d)}
  #detail .kv,#reportDetail .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-bottom:6px}
  #detail .kv b,#reportDetail .kv b{color:var(--muted);font-weight:500;white-space:nowrap}
  #detail table,#reportDetail table{font-size:13px}
  #detail .sigs,#reportDetail .sigs{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
  #detail .sig,#reportDetail .sig{flex:1;min-width:240px}
  #detail .sig img,#reportDetail .sig img{max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
</style>
</head>
<body>

<div id="lock">
  <div class="box">
    <h2>管理后台</h2>
    <p>请输入管理员密码进入</p>
    <input id="pwd" type="password" inputmode="numeric" maxlength="12" placeholder="4 位数字">
    <div class="err" id="lockErr"></div>
    <button onclick="unlock()">进入后台</button>
  </div>
</div>

<header>
  <h1>🐞 虫控消杀 · 管理后台</h1>
  <div class="btns">
    <a href="/report" style="color:#fff;background:rgba(255,255,255,.16);padding:9px 12px;border-radius:8px;text-decoration:none;font-size:14px">📝 现场服务报告录入</a>
    <button class="ghost" id="refreshBtn" onclick="load(true)">🔄 刷新云端数据</button>
    <button class="pri" onclick="exportExcel()">⬇ 导出 Excel</button>
    <button class="ghost" onclick="printRecordsFiltered()">🖨 批量导出 PDF</button>
    <button class="ghost" onclick="exportJSON()">⬇ 备份 JSON</button>
    <button class="danger" onclick="clearAll()">清空全部</button>
  </div>
</header>

<main>
  <div class="viewtabs">
    <button class="viewtab active" id="vtRecords" onclick="switchView('records')">消杀记录</button>
    <button class="viewtab" id="vtReports" onclick="switchView('reports')">现场服务报告 <span id="reportCount"></span></button>
  </div>

  <div id="viewRecords">
    <div class="toolbar">
      <select id="dateSel" onchange="render()"><option value="">全部日期</option></select>
      <input type="search" id="kw" placeholder="搜索：区域 / 范围 / 方式 / 药品 / 备注" oninput="render()">
    </div>
    <p class="tip">💡 点击表格中任意一行，可查看该条记录的完整详情（药品明细 + 双方签名）</p>
    <div class="stat" id="stat"></div>
    <div class="card"><div id="tbl"></div></div>
  </div>

  <div id="viewReports" style="display:none">
    <p class="tip">服务商在「现场服务报告录入」页填完并签名后，在这里查看内容、我方补签、导出 9 张表。</p>
    <div class="card"><div id="reportTbl"></div></div>
  </div>

  <div style="text-align:center;color:var(--muted);font-size:12px;padding:12px 0 4px">页面版本 v2026-11-05-1100 · 构建 <span id="buildId">__BUILD__</span></div>
</main>

<div id="reportDetail"><div class="box">
  <button class="close" onclick="closeReportDetail()">✕ 关闭</button>
  <div id="reportDetailBody"></div>
</div></div>

<div id="detail"><div class="box">
  <button class="close" onclick="closeDetail()">✕ 关闭</button>
  <div id="detailBody"></div>
</div></div>

<script>
/* ===== 数据 ===== */
let records=[], confirmations={}, drugs=[], providerName="能多洁";
let reports=[], currentReport=null;
const ST=(window.XK_STATIONS||{}), SH=(window.XK_SHEETS||{}), ORDER=(window.XK_SHEET_ORDER||[]);
const CHECK=["E","H","G","F-1","F-2"];
const TOTAL_STATIONS=CHECK.reduce((a,k)=>a+((ST[k]||[]).length),0);

/* ===== 工具 ===== */
function esc(s){ return (s||"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m])); }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function recordDrugs(r){
  if(Array.isArray(r.drugs) && r.drugs.length) return r.drugs;
  if(r.drugName) return [{drugName:r.drugName, targets:r.target?[r.target]:[], ratio:{dilution:r.ratio},
    bringIn:r.bringIn, spec:r.spec, used:r.used, waste:r.waste, remain:r.remain}];
  return [];
}
function ratioText(rt){ if(!rt) return "-"; const p=[];
  const _dil = Array.isArray(rt.dilution) ? rt.dilution : (rt.dilution ? [rt.dilution] : []);
  if(_dil.length===1 && /^[\/／]$/.test(_dil[0])) p.push("稀释：/");
  else if(_dil.length) p.push("稀释"+_dil.join("、"));
  if(rt.method) p.push(rt.method);
  return p.join(" ")||"-"; }
/* 工厂：新记录用 factories 数组，旧记录回退到 factory 字符串 */
function recFactories(r){
  if(Array.isArray(r.factories) && r.factories.length) return r.factories;
  if(r.factory) return [r.factory];
  return [];
}
function factoriesText(r){ return recFactories(r).join("、") || "-"; }
/* 稀释比例 / 施用方法 分开显示 */
function dilutionText(rt){
  if(!rt) return "-";
  const _dil = Array.isArray(rt.dilution) ? rt.dilution : (rt.dilution ? [rt.dilution] : []);
  if(!_dil.length) return "-";
  if(_dil.length===1 && /^[\/／]$/.test(_dil[0])) return "/";
  return _dil.join("、");
}
function methodText(rt){ return (rt && rt.method) ? rt.method : "-"; }

/* 只取日期部分（确认时间不显示几点几分） */
function dateOnly(s){
  s=(s||"").trim();
  if(!s) return "";
  const m=s.match(/^(\d{4}[-\/]\d{1,2}[-\/]\d{1,2})/);
  return m ? m[1] : s.split(/\s+/)[0];
}

/* ===== 页面自带构建号（服务器注入）：识别缓存旧版并自动刷新 ===== */
const PAGE_BUILD = "__BUILD__";
async function checkBuild(){
  try{
    if(!PAGE_BUILD || PAGE_BUILD.indexOf("__")===0) return false;
    const r = await fetch("/api/version?t=" + Date.now());
    if(!r.ok) return false;
    const j = await r.json();
    if(j && j.build && j.build !== PAGE_BUILD){
      const key = "xk_reload_" + j.build;
      if(!sessionStorage.getItem(key)){ sessionStorage.setItem(key, "1"); location.reload(); return true; }
    }
  }catch(e){}
  return false;
}

/* ===== 密码门 ===== */
const ADMIN_PWD="8888";
async function unlock(){
  const v=document.getElementById("pwd").value.trim();
  if(v===ADMIN_PWD){
    sessionStorage.setItem("xk_admin","ok");
    document.getElementById("lock").style.display="none";
    if(await checkBuild()) return;
    load(true);
  } else {
    document.getElementById("lockErr").textContent="密码错误，请重试";
  }
}
document.getElementById("pwd").addEventListener("keydown",e=>{ if(e.key==="Enter") unlock(); });
(async ()=>{
  if(await checkBuild()) return;   // 若为缓存旧版，自动刷新一次
  if(sessionStorage.getItem("xk_admin")==="ok"){
    document.getElementById("lock").style.display="none";
    load(true);
  }
})();

/* ===== 拉取云端数据 ===== */
async function load(showToast){
  const btn=document.getElementById("refreshBtn");
  if(btn){ btn.disabled=true; btn.textContent="🔄 刷新中…"; }
  try{
    const r=await fetch("/api/state");
    const s=await r.json();
    providerName=s.provider||"能多洁";
    records=s.records||[]; confirmations=s.confirmations||{}; drugs=s.drugs||[];
    reports=s.reports||[];
    render(); renderReports();
    if(showToast) toast("已刷新云端数据");
  }catch(e){ toast("刷新失败："+e.message); }
  finally{ if(btn){ btn.disabled=false; btn.textContent="🔄 刷新云端数据"; } }
}

/* ===== 渲染表格 ===== */
function filteredRecords(){
  const ds=document.getElementById("dateSel");
  const kw=document.getElementById("kw").value.trim().toLowerCase();
  let list=records.slice().sort((a,b)=> a.date.localeCompare(b.date)||a.time.localeCompare(b.time));
  if(ds.value) list=list.filter(r=>r.date===ds.value);
  if(kw) list=list.filter(r=>{
    const drs=recordDrugs(r);
    const hay=[r.zone,r.factory,recFactories(r).join(" "),r.scope,r.method,r.note,(r.time||""),drs.map(d=>d.drugName).join(" ")].join(" ").toLowerCase();
    return hay.includes(kw);
  });
  return list;
}
function render(){
  const ds=document.getElementById("dateSel");
  const dates=[...new Set(records.map(r=>r.date))].sort();
  const cur=ds.value;
  ds.innerHTML='<option value="">全部日期</option>'+dates.map(d=>`<option value="${d}">${d}</option>`).join("");
  if(cur && dates.includes(cur)) ds.value=cur;
  const list=filteredRecords();
  // 统计
  const confirmedDays=dates.filter(d=>confirmations[d]&&confirmations[d].confirmed).length;
  document.getElementById("stat").innerHTML=
    `共 <b>${records.length}</b> 条记录　|　<b>${dates.length}</b> 个日期　|　已签 <b>${confirmedDays}</b> 天　|　服务商：<b>${esc(providerName)}</b>　|　当前筛选 <b>${list.length}</b> 条`;
  // 表
  const tbl=document.getElementById("tbl");
  if(list.length===0){ tbl.innerHTML='<div class="empty">暂无记录（先在填单页提交，或点上方「刷新云端数据」）</div>'; return; }
  let h='<table><thead><tr><th>消杀日期</th><th>时间</th><th>厂区</th><th>工厂</th><th>范围</th><th>消杀方式</th><th>药品摘要</th><th>备注</th><th>确认状态</th></tr></thead><tbody>';
  list.forEach(r=>{
    const drs=recordDrugs(r);
    const c=confirmations[r.date]||{};
    const status = c.confirmed
      ? `<span class="ok">✓ 已双方签名</span><br><span style="font-size:11px;color:var(--muted)">${esc(c.provider?.name||'')} / ${esc(c.company?.name||'')}</span>`
      : (c.provider
          ? `<span class="wait">🟡 服务商已签</span><br><span style="font-size:11px;color:var(--muted)">待我司补签 · 点此处理</span>`
          : (c.company
              ? `<span class="wait">🟡 我司已签</span><br><span style="font-size:11px;color:var(--muted)">待服务商签名</span>`
              : `<span class="wait">⏳ 待签名</span>`));
    h+=`<tr class="rec" onclick="viewDetail('${esc(r.id)}')">
      <td>${esc(r.date)}</td><td>${esc(r.time)}</td><td>${esc(r.zone)||"-"}</td><td>${esc(factoriesText(r))}</td><td>${esc(r.scope)}</td>
      <td>${esc(r.method)}</td><td>${esc(drs.map(d=>d.drugName).join("、")||"-")}</td>
      <td>${esc(r.note)||"-"}</td><td>${status}</td></tr>`;
  });
  h+="</tbody></table>";
  tbl.innerHTML=h;
}

/* ===== 导出 PDF（打印窗口 → 另存为 PDF）===== */
function printRecordsFiltered(){
  const list=filteredRecords();
  if(!list.length){ toast("当前没有可导出的记录"); return; }
  if(!confirm(`将导出 ${list.length} 条记录为 PDF。\n打印窗口打开后，目标选「另存为 PDF」即可保存。继续？`)) return;
  printRecords(list.map(r=>r.id));
}
function printRecords(ids){
  const recs=records.filter(r=>ids.indexOf(r.id)>=0)
    .sort((a,b)=> a.date.localeCompare(b.date)||a.time.localeCompare(b.time));
  if(!recs.length){ toast("没有可导出的记录"); return; }
  const w=window.open("","_blank");
  if(!w){ toast("⚠ 浏览器拦截了新窗口，请允许弹出窗口后重试"); return; }
  w.document.write(buildPrintHTML(recs));
  w.document.close();
  setTimeout(()=>{ try{ w.focus(); w.print(); }catch(e){} }, 600);
}
function buildPrintHTML(recs){
  const parts = recs.map((r,idx)=>{
    const c=confirmations[r.date]||{};
    const drs=recordDrugs(r);
    let b='';
    b+=`<div class="sheet" ${idx>0?'style="page-break-before:always"':''}>
      <h1>消杀服务确认单</h1>
      <p class="meta"><b>服务商：</b>${esc(providerName)}　<b>日期：</b>${esc(r.date)}　<b>时间：</b>${esc(r.time||'')}　<b>状态：</b>${c.confirmed?'已双方签名':'待签名'}</p>
      <table class="kv"><tbody>
        <tr><th>厂区</th><td>${esc(r.zone)||'-'}</td><th>工厂</th><td>${esc(factoriesText(r))}</td></tr>
        <tr><th>范围</th><td>${esc(r.scope)||'-'}</td><th>消杀方式</th><td>${esc(r.method)||'-'}</td></tr>
        <tr><th>备注</th><td colspan="3">${esc(r.note)||'-'}</td></tr>
      </tbody></table>
      <h2>药品明细（${drs.length}）</h2>`;
    if(drs.length){
      b+='<table class="grid"><thead><tr><th>药品名称</th><th>靶标生物</th><th>稀释比例</th><th>施用方法</th><th>带入数量</th><th>规格</th><th>使用量(L)</th><th>带出废弃物料/包装</th><th>剩余数量(L)</th></tr></thead><tbody>';
      drs.forEach(d=>{ b+=`<tr><td>${esc(d.drugName)}</td><td>${esc((d.targets||[]).join('、')||'-')}</td><td>${esc(dilutionText(d.ratio))}</td><td>${esc(methodText(d.ratio))}</td><td>${esc(d.bringIn||'-')}</td><td>${esc(d.spec||'-')}</td><td>${esc(d.used||'-')}</td><td>${esc(d.waste||'-')}</td><td>${esc(d.remain||'-')}</td></tr>`; });
      b+='</tbody></table>';
    } else b+='<p class="meta">（无药品记录）</p>';
    b+=`<h2>双方签名</h2><div class="signs">
        <div class="sign"><div class="sign-t">服务商签名人：${esc(c.provider?.name||'（未签）')}</div>
          ${c.provider?.img?`<img src="${c.provider.img}">`:'<div class="noline">（未签）</div>'}</div>
        <div class="sign"><div class="sign-t">我司确认人：${esc(c.company?.name||'（未签）')}</div>
          ${c.company?.img?`<img src="${c.company.img}">`:'<div class="noline">（未签）</div>'}</div>
      </div>`;
    if(c.confirmed) b+=`<p class="meta">确认日期：${esc(dateOnly(c.confirmTs))}</p>`;
    b+='</div>';
    return b;
  }).join("");
  const css=`
    *{box-sizing:border-box}
    body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#222;margin:0;padding:18px}
    .sheet{max-width:820px;margin:0 auto}
    h1{font-size:20px;text-align:center;margin:0 0 10px}
    h2{font-size:15px;margin:14px 0 6px}
    .meta{font-size:13px;color:#333;margin:4px 0 10px;line-height:1.7}
    table{border-collapse:collapse;width:100%;font-size:12px}
    .kv th,.kv td{border:1px solid #bbb;padding:6px 8px;text-align:left}
    .kv th{background:#f3f5f3;width:90px;color:#444;font-weight:600}
    .grid th,.grid td{border:1px solid #bbb;padding:6px 7px;text-align:left}
    .grid th{background:#f3f5f3}
    .signs{display:flex;gap:20px;margin-top:6px}
    .sign{flex:1}
    .sign-t{font-size:13px;color:#444;margin-bottom:4px}
    .sign img{max-width:100%;border:1px solid #ccc;border-radius:6px}
    .noline{font-size:12px;color:#888;padding:26px 0}
    @media print{ body{padding:0} .sheet{max-width:none} @page{margin:14mm} }`;
  return `<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>消杀服务确认单</title><style>${css}</style></head><body>${parts}</body></html>`;
}

/* ===== 导出 Excel（双表） ===== */
function exportExcel(){
  if(records.length===0){ toast("暂无数据可导出"); return; }
  const sorted=[...records].sort((a,b)=> a.date.localeCompare(b.date)||a.time.localeCompare(b.time));
  const head1=["消杀日期","厂区","工厂","消杀时间","范围","消杀方式","药品摘要","备注","确认状态","服务商签名人","我司确认人","确认日期"];
  const data1=[head1];
  const head2=["消杀日期","厂区","工厂","消杀时间","药品名称","靶标生物","稀释比例","施用方法","带入数量","规格","使用量(L)","带出废弃物料/包装","剩余数量(L)"];
  const data2=[head2];
  sorted.forEach(r=>{
    const c=confirmations[r.date]||{};
    const drs=recordDrugs(r);
    const facs=factoriesText(r);
    data1.push([ r.date,r.zone||"",facs,r.time,r.scope,r.method, drs.map(d=>d.drugName).join("、")||"-", r.note,
      c.confirmed?"已双方签名":(c.provider?"服务商已签·待我司":(c.company?"我司已签·待服务商":"待签名")),
      c.provider?.name||"", c.company?.name||"", c.confirmed?c.confirmTs:"" ]);

/* ===== 后台签名画板（我司补签用） ===== */
function initAdmPad(){
  const cv=document.getElementById("admPad"); if(!cv) return;
  const ctx=cv.getContext("2d");
  if(!ctx) return;
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height);
  let drawing=false,lx=0,ly=0;
  const pos=e=>{ const r=cv.getBoundingClientRect(); const t=e.touches?e.touches[0]:e;
    return {x:(t.clientX-r.left)*(cv.width/r.width), y:(t.clientY-r.top)*(cv.height/r.height)}; };
  const start=e=>{ drawing=true; const p=pos(e); lx=p.x; ly=p.y; e.preventDefault(); };
  const move=e=>{ if(!drawing) return; const p=pos(e);
    ctx.lineWidth=2.4; ctx.lineCap="round"; ctx.strokeStyle="#111";
    ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p.x,p.y); ctx.stroke(); lx=p.x; ly=p.y; e.preventDefault(); };
  const end=()=>{ drawing=false; };
  cv.addEventListener("mousedown",start); cv.addEventListener("mousemove",move);
  window.addEventListener("mouseup",end);
  cv.addEventListener("touchstart",start,{passive:false}); cv.addEventListener("touchmove",move,{passive:false});
  cv.addEventListener("touchend",end);
}
function clearAdmPad(){
  const cv=document.getElementById("admPad"); if(!cv) return;
  const ctx=cv.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height);
}
function admPadEmpty(cv){
  const ctx=cv.getContext("2d");
  const d=ctx.getImageData(0,0,cv.width,cv.height).data;
  for(let i=0;i<d.length;i+=4){ if(d[i]<230||d[i+1]<230||d[i+2]<230) return false; }
  return true;
}

    'th,td{border:1px solid #ccc;padding:4px 6px;text-align:left}.rep-sec{page-break-inside:avoid;margin-bottom:10px}'+
    '</style></head><body>'+node.innerHTML+'</body></html>');
  w.document.close();
  setTimeout(()=>w.print(),300);
}
async function exportReportExcel(id){
  let r=(currentReport&&currentReport.id===id)?currentReport:null;
  if(!r){
    try{ const resp=await fetch("/api/reports/"+encodeURIComponent(id)); r=await resp.json(); }
    catch(e){ toast("读取报告失败"); return; }
  }
  if(typeof XLSX==="undefined"){ toast("Excel 组件未加载，请刷新后重试"); return; }
  const sh=r.sheets||{}, wb=XLSX.utils.book_new(), mh=SH.SR?SH.SR.materialHead:[];
  const srAoa=[["广州旺旺食品有限公司现场服务报告"],["项目","内容"]];
  (SH.SR?SH.SR.fields:[]).forEach(fd=>{
    let v=(sh.SR&&sh.SR.fields)?sh.SR.fields[fd.k]:null;
    if(v==null||v==="") v=fd.def||""; if(Array.isArray(v)) v=v.join("、");
    srAoa.push([fd.t,String(v)]);
  });
  srAoa.push([]); srAoa.push(["物料使用记录"]); srAoa.push(mh);
  ((sh.SR&&sh.SR.materials)||[]).forEach(m=>srAoa.push(mh.map((_,j)=>(m&&m["m"+j])||"")));
  const c=confirmations[r.date]||{};
  srAoa.push([]);
  srAoa.push(["服务商签名",(c.provider||{}).name||"",(c.provider||{}).ts||""]);
  srAoa.push(["我司签名",(c.company||{}).name||"",(c.company||{}).ts||""]);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(srAoa),"SR");
  CHECK.forEach(n=>{
    const d=sh[n]||{}, rows=[["编号",...SH[n].cols.map(c=>c.t)]];
    (ST[n]||[]).forEach(id=>{ const row=d[id]||{}; rows.push([id,...SH[n].cols.map(c=>row[c.k]||"")]); });
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),n);
  });
  ["消杀记录","物料进出厂清单","CAPA"].forEach(n=>{
    const rows=[SH[n].cols.map(c=>c.t),...(sh[n]||[]).filter(x=>x&&Object.keys(x).length).map(x=>SH[n].cols.map(c=>x[c.k]||""))];
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),n);
  });
  XLSX.writeFile(wb,"现场服务报告_"+r.date+".xlsx");
  toast("已导出 9 张表 Excel");
}
async function deleteReportById(id){
  if(!confirm("确定删除这份现场服务报告？删除后无法恢复。")) return;
  try{
    const r=await fetch("/api/reports/"+encodeURIComponent(id),{method:"DELETE"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    closeReportDetail(); await load(false); toast("已删除报告");
  }catch(e){ toast("⚠ 删除失败："+e.message); }
}

/* ===== 轻提示 ===== */
let toastTimer;
function toast(msg){
  let t=document.getElementById("xkToast");
  if(!t){ t=document.createElement("div"); t.id="xkToast";
    t.style.cssText="position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:99;opacity:0;transition:opacity .2s";
    document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity="1";
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.opacity="0",2200);
}
</script>
